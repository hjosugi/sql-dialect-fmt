name: VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, without leading v. Defaults to Cargo.toml."
        required: false
        default: ""
      publish:
        description: "Publish to VS Code Marketplace."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: Package and optionally publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: vscode-extension
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Resolve package version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="$(./scripts/workspace-version.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check version consistency
        run: python3 scripts/check-version-consistency.py "${{ steps.version.outputs.version }}"
      - name: Build and validate VSIX through go-task
        run: task vscode:package VERSION="${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sql-dialect-fmt-vscode-v${{ steps.version.outputs.version }}
          path: target/dist/sql-dialect-fmt-v${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
      - name: Validate VS Code Marketplace credentials
        if: ${{ inputs.publish }}
        env:
          VSCE_AUTH_MODE: ${{ vars.VSCE_AUTH_MODE || 'pat' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
        run: ./scripts/check-publishing-credentials.sh vscode
      - name: Azure login for VS Code Marketplace
        if: ${{ inputs.publish && vars.VSCE_AUTH_MODE == 'azure' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Publish VS Code Marketplace
        if: ${{ inputs.publish }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_AUTH_MODE: ${{ vars.VSCE_AUTH_MODE || 'pat' }}
        run: ./scripts/publish-vscode-marketplace.sh "target/dist/sql-dialect-fmt-v${{ steps.version.outputs.version }}.vsix"
